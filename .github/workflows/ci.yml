name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: CasinoCore tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Run tests
        working-directory: Packages/CasinoCore
        run: swift test -c release -Xswiftc -enable-testing

  ipad-app:
    name: iPad app build (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iPad Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project BlackCasino.xcodeproj \
            -scheme BlackCasino \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 200
