name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: CasinoCore tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Run tests
        working-directory: Packages/CasinoCore
        run: swift test -c release -Xswiftc -enable-testing

  server:
    name: Server build & tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build & test
        working-directory: Server
        run: swift test

  playgrounds-package:
    name: Swift-Playgrounds-Paket (iPad, ohne Mac)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Paket ist aktuell
        run: |
          python3 scripts/make_playgrounds.py
          git diff --exit-code -- BlackCasino.swiftpm || (echo "BlackCasino.swiftpm ist veraltet – scripts/make_playgrounds.py ausführen" && exit 1)
      - name: Build für iPad-Simulator
        working-directory: BlackCasino.swiftpm
        run: |
          xcodebuild build -scheme BlackCasino -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:" build.log | sort -u | head -100 || true
          tail -n 15 build.log
          exit $STATUS

  ipad-app:
    name: iPad app build (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iPad Simulator
        run: |
          xcodebuild build \
            -project BlackCasino.xcodeproj \
            -scheme BlackCasino \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|warning: .*(isolated|Sendable)" build.log | sort -u | head -150 || true
          tail -n 15 build.log
          exit $STATUS
